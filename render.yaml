# Render Blueprint — Relune (web + Postgres + Redis)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: relune
    runtime: docker
    plan: starter
    healthCheckPath: /api/health?mode=ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: AUTH_URL
        sync: false
      - key: NEXTAUTH_URL
        fromService:
          name: relune
          type: web
          property: host
      - key: AUTH_SECRET
        generateValue: true
      - key: MAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMS_PROVIDER
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: relune-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: relune-redis
          type: redis
          property: connectionString

  - type: redis
    name: relune-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru

databases:
  - name: relune-db
    plan: basic-256mb
    postgresMajorVersion: "16"
