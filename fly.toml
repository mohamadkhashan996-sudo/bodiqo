# Fly.io example — Relune needs a long-running Node process (Next + Socket.IO).
# Create: fly launch --no-deploy
# Secrets: fly secrets set AUTH_SECRET=... AUTH_URL=https://... DATABASE_URL=... REDIS_URL=... MAIL_PROVIDER=resend RESEND_API_KEY=...

app = "relune"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/api/health?mode=ready"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
