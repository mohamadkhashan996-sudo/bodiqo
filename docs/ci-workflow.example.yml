# Copy to `.github/workflows/ci.yml` after granting GitHub `workflow` scope.
# Canonical workflow now lives at `.github/workflows/ci.yml` (PHASE_12).
# This file remains as a readable template for forks.

name: CI

on:
  push:
    branches: [social-platform, main, develop]
  pull_request:
    branches: [social-platform, main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Use .github/workflows/ci.yml"
