# Development stack (weak defaults — DO NOT use as production).
# Production: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
name: relune

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: relune
      POSTGRES_PASSWORD: relune
      POSTGRES_DB: relune
    ports:
      - "5432:5432"
    volumes:
      - relune_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relune -d relune"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - relune_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://relune:relune@postgres:5432/relune?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      AUTH_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - relune_uploads:/app/public/uploads
      - relune_backups:/app/data/backups

volumes:
  relune_pg:
  relune_redis:
  relune_uploads:
  relune_backups:
