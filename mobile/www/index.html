<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1F9B8E" />
    <title>Relune</title>
    <style>
      :root {
        color-scheme: light;
        --cloud: #f4f2ee;
        --ink: #12141a;
        --signal: #1f9b8e;
        --muted: #6b6e76;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: Georgia, "Times New Roman", serif;
        background:
          radial-gradient(
            ellipse 80% 50% at 10% -10%,
            color-mix(in srgb, var(--signal) 18%, transparent),
            transparent
          ),
          var(--cloud);
        color: var(--ink);
        text-align: center;
      }
      h1 {
        margin: 0;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        font-size: 0.95rem;
        font-weight: 600;
      }
      p {
        margin: 1rem auto 0;
        max-width: 28rem;
        font-family: system-ui, sans-serif;
        font-size: 0.95rem;
        line-height: 1.55;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Relune</h1>
      <p>
        Opening Relune… If this stays visible, set
        <code>CAPACITOR_SERVER_URL</code> and run
        <code>npm run mobile:sync</code>.
      </p>
    </main>
  </body>
</html>
